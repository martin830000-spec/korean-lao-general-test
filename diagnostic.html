<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>통합 진단센터</title><style>body{font-family:system-ui;margin:0;background:#f4f6fa;color:#182235}.c{max-width:520px;margin:15vh auto;background:#fff;border:1px solid #dde3ed;border-radius:16px;padding:20px;text-align:center}.b{display:inline-block;margin-top:14px;padding:11px 16px;border-radius:10px;background:#294aa5;color:#fff;text-decoration:none;font-weight:800}</style></head><body><div class="c"><h2>번역 품질 통합 진단센터</h2><p>진단 기능은 부부앱과 일반 통역앱을 한 곳에서 검사하도록 통합되었습니다.</p><a class="b" id="go">본앱 진단센터로 이동</a></div><script>function siblingPath(name){const p=location.pathname.split('/').filter(Boolean);if(p.length&&/\.[A-Za-z0-9]+$/.test(p[p.length-1]))p.pop();if(p.length&&/^(?:wife|laos-translator|korean-lao-general(?:-test)?)$/i.test(p[p.length-1]))p.pop();return '/'+[...p,name].join('/')+'/'};document.getElementById('go').href=siblingPath('laos-translator')+'?admin=general';</script></body></html>
