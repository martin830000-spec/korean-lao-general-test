&lt;section class="gm-card"&gt;&lt;div class="gm-kicker"&gt;통역 언어 선택&lt;/div&gt;&lt;h3&gt;🌐 다국어 통역 사용법&lt;/h3&gt;&lt;div class="gm-grid"&gt;&lt;div class="gm-item"&gt;&lt;b&gt;1. 통역 언어 선택&lt;/b&gt;상단의 &lt;b&gt;통역 언어&lt;/b&gt;에서 라오어·영어·중국어(간체)·일본어·태국어 중 대화할 언어를 고릅니다.&lt;/div&gt;&lt;div class="gm-item"&gt;&lt;b&gt;2. 말하는 사람이 바뀔 때&lt;/b&gt;기존 &lt;b&gt;언어전환&lt;/b&gt;을 누르면 선택한 두 언어의 번역 방향만 뒤집힙니다.&lt;/div&gt;&lt;/div&gt;&lt;div class="gm-info"&gt;남편 모드에서는 내 언어가 &lt;b&gt;한국어&lt;/b&gt;로 고정됩니다. 예: 한국어 → 영어 ⇄ 영어 → 한국어. 앱의 조작 메뉴는 계속 한국어로 표시됩니다.&lt;/div&gt;&lt;/section&gt;

&lt;section class="gm-card"&gt;&lt;div class="gm-kicker"&gt;대화를 더 빠르게&lt;/div&gt;&lt;h3&gt;⚡ 2. 자동통역 · 자동 음성출력&lt;/h3&gt;&lt;div class="gm-grid"&gt;&lt;div class="gm-item"&gt;&lt;b&gt;⚡ 자동통역&lt;/b&gt;음성입력이 끝나면 자동으로 번역합니다. &lt;b&gt;키보드로 직접 입력한 문장은 자동번역하지 않습니다.&lt;/b&gt;&lt;/div&gt;&lt;div class="gm-item"&gt;&lt;b&gt;🔊 자동음성&lt;/b&gt;켜 두면 번역이 끝난 뒤 상대방 언어를 자동으로 읽어줍니다.&lt;/div&gt;&lt;/div&gt;&lt;div class="gm-pillflow"&gt;&lt;span&gt;말하기&lt;/span&gt;&lt;i&gt;→&lt;/i&gt;&lt;span&gt;자동 번역&lt;/span&gt;&lt;i&gt;→&lt;/i&gt;&lt;span&gt;자동 재생&lt;/span&gt;&lt;/div&gt;&lt;div class="gm-info"&gt;서로 말을 주고받을 때는 &lt;b&gt;자동통역 + 자동음성&lt;/b&gt;을 함께 켜 두면 편합니다.&lt;/div&gt;&lt;/section&gt;
&lt;section class="gm-card"&gt;&lt;div class="gm-kicker"&gt;음성 버튼 상태&lt;/div&gt;&lt;h3&gt;🔊 3. 듣기 · 음성 중지 · 다시 듣기&lt;/h3&gt;&lt;div class="gm-pillflow"&gt;&lt;span&gt;🔊 듣기&lt;/span&gt;&lt;i&gt;→&lt;/i&gt;&lt;span&gt;⏹️ 음성 중지&lt;/span&gt;&lt;i&gt;→&lt;/i&gt;&lt;span&gt;🔊 다시 듣기&lt;/span&gt;&lt;/div&gt;&lt;div class="gm-tip"&gt;상대방이 잘 듣지 못했다면 재생이 끝난 뒤 &lt;b&gt;다시 듣기&lt;/b&gt;를 누르세요. 소리가 없으면 휴대폰 미디어 음량과 Bluetooth를 확인하세요.&lt;/div&gt;&lt;/section&gt;

&lt;section class="gm-card"&gt;&lt;div class="gm-kicker"&gt;헷갈리기 쉬운 버튼&lt;/div&gt;&lt;h3&gt;🧰 5. 결과와 지우기 기능&lt;/h3&gt;&lt;div class="gm-grid"&gt;&lt;div class="gm-item"&gt;&lt;b&gt;의미확인&lt;/b&gt;번역문을 다시 원래 언어로 확인해 핵심 뜻이 유지됐는지 살펴봅니다.&lt;/div&gt;&lt;div class="gm-item"&gt;&lt;b&gt;📋 번역복사 · ↻ 재번역&lt;/b&gt;같은 원문을 다시 번역하거나 결과를 다른 앱에 붙여넣습니다.&lt;/div&gt;&lt;div class="gm-item"&gt;&lt;b&gt;입력 지우기&lt;/b&gt;입력창의 문장만 지우고 이미 나온 번역 결과는 남깁니다.&lt;/div&gt;&lt;div class="gm-item"&gt;&lt;b&gt;↺ 전체 지우기&lt;/b&gt;현재 입력과 번역 결과를 함께 비웁니다. 최근 대화 기록은 지우지 않습니다.&lt;/div&gt;&lt;/div&gt;&lt;div class="gm-info"&gt;&lt;b&gt;🕘 최근 대화&lt;/b&gt;에서 이전 번역을 다시 확인하거나 불러올 수 있습니다.&lt;/div&gt;&lt;/section&gt;
&lt;section class="gm-card"&gt;&lt;div class="gm-kicker"&gt;사용 전에 잠깐 확인&lt;/div&gt;&lt;h3&gt;⚠️ 6. 알아두면 좋은 점&lt;/h3&gt;&lt;div class="gm-warnings"&gt;&lt;div class="gm-warning good"&gt;&lt;b&gt;짧고 분명하게&lt;/b&gt;긴 문장을 반복하기보다 핵심을 1~2문장으로 나누면 이해하기 쉽습니다.&lt;/div&gt;&lt;div class="gm-warning"&gt;&lt;b&gt;음성인식 확인&lt;/b&gt;소음이 있으면 말이 다르게 인식될 수 있습니다. 번역 전에 입력문을 확인하세요.&lt;/div&gt;&lt;div class="gm-warning"&gt;&lt;b&gt;이름·주소·시간·금액&lt;/b&gt;사람 이름, 호텔명, 전화번호, 날짜, 시간, 가격과 주소는 다시 확인하세요.&lt;/div&gt;&lt;div class="gm-warning hot"&gt;&lt;b&gt;중요한 상황&lt;/b&gt;의료·계약·금융·법률처럼 오해의 영향이 큰 내용은 필요하면 사람의 통역이나 추가 확인을 이용하세요.&lt;/div&gt;&lt;/div&gt;&lt;div class="gm-end"&gt;&lt;b&gt;가장 편한 방법:&lt;/b&gt; 자동통역 ON + 자동음성 ON · 상대방 차례에는 언어전환&lt;/div&gt;&lt;/section&gt;

&lt;section class="gm-hero"&gt;&lt;h3&gt;🌏 ລ່າມທົ່ວໄປ&lt;/h3&gt;&lt;p&gt;ໃຊ້ສຳລັບເດີນທາງ ແລະ ສົນທະນາປະຈຳວັນ. ຈື່ພຽງ &lt;b&gt;ເວົ້າ/ພິມ → ແປ → ຟັງ ຫຼື ເບິ່ງຕົວໃຫຍ່&lt;/b&gt;.&lt;/p&gt;&lt;button class="general-update-history-btn" type="button" data-update-history-lang="lo"&gt;🆕 ປະຫວັດອັບເດດ&lt;/button&gt;&lt;div class="gm-flow"&gt;&lt;div&gt;&lt;b&gt;🎙️&lt;/b&gt;ເວົ້າ/ພິມ&lt;/div&gt;&lt;div&gt;&lt;b&gt;➤&lt;/b&gt;ແປ&lt;/div&gt;&lt;div&gt;&lt;b&gt;🔊&lt;/b&gt;ຟັງ&lt;/div&gt;&lt;div&gt;&lt;b&gt;⇄&lt;/b&gt;ສະຫຼັບພາສາ&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class="gm-card"&gt;&lt;div class="gm-kicker"&gt;ເລືອກພາສາແປ&lt;/div&gt;&lt;h3&gt;🌐 ວິທີໃຊ້ການແປຫຼາຍພາສາ&lt;/h3&gt;&lt;div class="gm-grid"&gt;&lt;div class="gm-item"&gt;&lt;b&gt;1. ເລືອກພາສາຄູ່ສົນທະນາ&lt;/b&gt;ຢູ່ດ້ານເທິງ ເລືອກ ເກົາຫຼີ, ອັງກິດ, ຈີນ(ຕົວຫຍໍ້), ຍີ່ປຸ່ນ ຫຼື ໄທ.&lt;/div&gt;&lt;div class="gm-item"&gt;&lt;b&gt;2. ເມື່ອປ່ຽນຄົນເວົ້າ&lt;/b&gt;ກົດ &lt;b&gt;ສະຫຼັບພາສາ&lt;/b&gt; ເພື່ອກັບທິດການແປຂອງຄູ່ພາສາທີ່ເລືອກ.&lt;/div&gt;&lt;/div&gt;&lt;div class="gm-info"&gt;ໂໝດພັນລະຍາຈະລັອກພາສາຂອງຕົນເປັນ &lt;b&gt;ພາສາລາວ&lt;/b&gt;. ຕົວຢ່າງ: ລາວ → ອັງກິດ ⇄ ອັງກິດ → ລາວ. ເມນູຄວບຄຸມຈະຍັງເປັນພາສາລາວ.&lt;/div&gt;&lt;/section&gt;

function diagSttNormalizeText(s,lang){
  let t=String(s||'').normalize('NFC').trim().toLowerCase();
  try{t=t.replace(/[\p{P}\p{S}]/gu,' ')}catch(_){t=t.replace(/[.,!?;:'"`()\[\]{}&lt;&gt;\/\\|~@#$%^&amp;*_+=-]/g,' ')}
  if(lang==='lo-LA')return t.replace(/\s+/g,'');
  return t.replace(/\s+/g,' ').trim();
}
function diagSttLevenshtein(a,b){a=Array.from(a||'');b=Array.from(b||'');const prev=new Array(b.length+1),cur=new Array(b.length+1);for(let j=0;j&lt;=b.length;j++)prev[j]=j;for(let i=1;i&lt;=a.length;i++){cur[0]=i;for(let j=1;j&lt;=b.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));for(let j=0;j&lt;=b.length;j++)prev[j]=cur[j]}return prev[b.length]}
function diagSttMetrics(reference,hypothesis,lang){const r=diagSttNormalizeText(reference,lang),h=diagSttNormalizeText(hypothesis,lang),cer=diagSttLevenshtein(r,h)/Math.max(1,Array.from(r).length);let wer=null;if(lang!=='lo-LA'){const rw=r?r.split(/\s+/):[],hw=h?h.split(/\s+/):[];wer=diagSttLevenshtein(rw,hw)/Math.max(1,rw.length)}return{referenceNorm:r,hypothesisNorm:h,cer,wer,exact:r===h}}
function diagSttPcmScale(pcm,gain){const out=new Int16Array(pcm.length);for(let i=0;i&lt;pcm.length;i++)out[i]=Math.max(-32768,Math.min(32767,Math.round(pcm[i]*gain)));return out}
function diagSttPcmNoise(pcm,amp=700){let seed=0x361180&gt;&gt;&gt;0;const out=new Int16Array(pcm.length);for(let i=0;i&lt;pcm.length;i++){seed=(Math.imul(seed,1664525)+1013904223)&gt;&gt;&gt;0;const n=((seed/4294967295)*2-1)*amp;out[i]=Math.max(-32768,Math.min(32767,Math.round(pcm[i]+n)))}return out}
function diagSttPcmRate(pcm,factor){factor=Math.max(.65,Math.min(1.45,Number(factor)||1));const n=Math.max(1,Math.floor(pcm.length/factor)),out=new Int16Array(n);for(let i=0;i&lt;n;i++){const x=i*factor,j=Math.floor(x),f=x-j,a=pcm[Math.min(pcm.length-1,j)]||0,b=pcm[Math.min(pcm.length-1,j+1)]||a;out[i]=Math.round(a*(1-f)+b*f)}return out}
function diagSttPcmPause(pcm,ms=320){const pause=new Int16Array(Math.max(1,Math.round(STT_RATE*ms/1000))),mid=Math.floor(pcm.length*.52),out=new Int16Array(pcm.length+pause.length);out.set(pcm.slice(0,mid),0);out.set(pause,mid);out.set(pcm.slice(mid),mid+pause.length);return out}
function diagSttTransformPcm(pcm,profile){if(profile==='low')return diagSttPcmScale(pcm,.34);if(profile==='noise')return diagSttPcmNoise(pcm,760);if(profile==='fast')return diagSttPcmRate(pcm,1.18);if(profile==='slow')return diagSttPcmRate(pcm,.86);if(profile==='pause')return diagSttPcmPause(pcm,340);return new Int16Array(pcm)}

  generalVoiceDiagCheck(run);const voice=diagSttVoiceFor(lang,gender);if(!voice)throw new Error('DIAG_TTS_VOICE_UNAVAILABLE_'+lang);
  const c=new AbortController(),st=performance.now();if(run)run.ttsController=c;
  try{const res=await relayFetch('/azure/tts',{method:'POST',headers:{'Content-Type':'application/json',Accept:'audio/mpeg'},body:JSON.stringify({languageCode:lang,voice,text:String(text||'')}),signal:c.signal},TTS_TIMEOUT_MS);generalVoiceDiagCheck(run);

function invoke(name){const w=payloadWin();try{if(w&&typeof w[name]==='function')return w[name]()}catch(e){console.error('[GENERAL SHELL INVOKE]',name,e)}}
function setOverlay(open){shell.classList.toggle('payload-overlay-active',!!open)}
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||!e.data)return;if(e.data.type==='general-shell-ready'||e.data.type==='general-shell-mode')applyShellLanguage(e.data.mode);if(e.data.type==='general-shell-overlay')setOverlay(e.data.open)});
document.getElementById('husbandModeBtn').addEventListener('click',()=>selectMode('husband'));
document.getElementById('wifeModeBtn').addEventListener('click',()=>selectMode('wife'));
document.getElementById('shellGuideBtn').addEventListener('click',()=>invoke('openManual'));
document.getElementById('firstScreenBtn').addEventListener('click',()=>invoke('goMainHome'));
document.getElementById('shellAdminGear').addEventListener('click',()=>invoke('openUnifiedAdmin'));
try{new ResizeObserver(fitShellTopbar).observe(document.getElementById('shellSwitchbar'))}catch(_){window.addEventListener('resize',fitShellTopbar)}
frame.addEventListener('load',()=>{loading.classList.remove('show');frame.dataset.loaded='1';setTimeout(()=>{try{const w=payloadWin();const m=w&&typeof w.uiLang==='function'&&w.uiLang()==='lo'?'wife':'husband';applyShellLanguage(m)}catch(_){applyShellLanguage('husband')}},0)});
loading.classList.add('show');bootGeneralPayload().catch(e=>{console.error('[GENERAL PROMPT BOOT]',e);loading.textContent='프롬프트 설정을 불러오지 못했습니다. 새로고침해 주세요.';loading.classList.add('show')});applyShellLanguage('husband');
</script>
<script id="general-viewport-bridge-v361162">
(function installGeneralViewportBridgeV361162(){
  if(window.__generalViewportBridgeV361162)return;window.__generalViewportBridgeV361162=true;
  let raf=0,lastH=0,lastOff=0,lastShellH=0;
  function sync(){
    if(raf)cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>{raf=0;const vv=window.visualViewport;const rawH=Math.max(1,Math.round(vv?vv.height:window.innerHeight));const h=Math.max(240,rawH);const off=vv?Math.max(0,Math.round(vv.offsetTop||0)):0;const shellH=Math.max(240,Math.round(rawH+off));if(Math.abs(shellH-lastShellH)>=2){document.documentElement.style.setProperty('--app-vvh',shellH+'px');lastShellH=shellH}if(Math.abs(h-lastH)>=2||Math.abs(off-lastOff)>=2){lastH=h;lastOff=off;try{const f=document.getElementById('generalFrame');if(f&&f.contentWindow)f.contentWindow.postMessage({type:'integrated-viewport',height:h,offsetTop:off},'*')}catch(_){}}});
  }

  window.addEventListener('resize',sync,{passive:true});window.addEventListener('orientationchange',()=>{setTimeout(sync,80);setTimeout(sync,400)},{passive:true});window.addEventListener('pageshow',sync,{passive:true});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});document.getElementById('generalFrame')?.addEventListener('load',()=>{setTimeout(sync,0);setTimeout(sync,180)});setTimeout(sync,0);
